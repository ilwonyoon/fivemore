name: FiveMore

options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: targeted
    DEVELOPMENT_TEAM: LG7667PAS6
    CODE_SIGN_STYLE: Automatic

targets:
  FiveMore:
    type: application
    platform: iOS
    sources:
      - path: FiveMore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fivemore.app
        PRODUCT_NAME: FiveMore
        PRODUCT_MODULE_NAME: FiveMore
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 4
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Five More Minutes
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to begin a five-minute moment.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record your own alarm sound for when the moment ends.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save each 5 More photo to your photo library.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Show the 5 More photos you have saved in Memories.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: FiveMoreWidgets
        embed: true
    scheme:
      testTargets:
        - FiveMoreTests
        - FiveMoreUITests
      storeKitConfiguration: FiveMore/Resources/Products.storekit

  FiveMoreWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FiveMoreWidgets
        excludes:
          - Info.plist
      - path: FiveMore/Features/Capture/StartMomentIntent.swift
      - path: FiveMore/Core/LaunchRequest.swift
      - path: FiveMore/Core/MomentActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fivemore.app.widgets
        PRODUCT_NAME: FiveMoreWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: FiveMoreWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 5 More
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 4
        TARGETED_DEVICE_FAMILY: 1
        SKIP_INSTALL: YES

  FiveMoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FiveMoreTests
    dependencies:
      - target: FiveMore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fivemore.app.tests
        GENERATE_INFOPLIST_FILE: YES

  FiveMoreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FiveMoreUITests
    dependencies:
      - target: FiveMore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fivemore.app.uitests
        GENERATE_INFOPLIST_FILE: YES
